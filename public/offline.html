<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline · Dev/Tools</title>
    <meta name="theme-color" content="#0A0E12">
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <style>
      /* Self-contained on purpose: this page is served when the network is gone,
         so it uses system fonts and inline styles only. Mission Control palette. */
      :root { --bg: #0A0E12; --panel: #0E1419; --ink: #DAE3EB; --muted: #8494A3; --rule: rgba(218,227,235,.22); --grid: rgba(218,227,235,.035); --amber: #FFB020; --ok: #7BD88F; color-scheme: dark; }
      @media (prefers-color-scheme: light) {
        :root { --bg: #E7EDF2; --panel: #F4F7FA; --ink: #0B2236; --muted: #4A6074; --rule: rgba(11,34,54,.28); --grid: rgba(11,34,54,.06); --amber-text: #8F5400; color-scheme: light; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--ink);
        background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 32px 32px; background-position: -1px -1px;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; }
      .card {
        width: min(560px, 100%); padding: 28px; background: var(--panel); border: 1px solid var(--rule);
        background-image: linear-gradient(var(--amber), var(--amber)), linear-gradient(var(--amber), var(--amber)), linear-gradient(var(--amber), var(--amber)), linear-gradient(var(--amber), var(--amber));
        background-size: 12px 1px, 1px 12px, 12px 1px, 1px 12px;
        background-position: top left, top left, bottom right, bottom right; background-repeat: no-repeat;
      }
      .status { display: flex; gap: 10px; align-items: center; color: var(--muted); margin: 0 0 14px; }
      .status b { color: var(--amber-text, var(--amber)); font-weight: 600; }
      h1 { margin: 0 0 8px; font: 700 clamp(28px, 6vw, 40px)/1 "Arial Narrow", "Helvetica Neue", Arial, sans-serif; text-transform: uppercase; letter-spacing: .01em; }
      p { margin: 0; color: var(--muted); }
      .actions { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
      a, button { appearance: none; cursor: pointer; text-decoration: none; padding: 10px 16px; border: 1px solid var(--rule); background: transparent; color: var(--ink); min-height: 40px; }
      button { background: var(--amber); border-color: var(--amber); color: #0A0E12; }
      a:hover { border-color: var(--ink); }
      a:focus-visible, button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="status mono"><span>LINK network.uplink</span><b>LOST</b></p>
      <h1>You're offline</h1>
      <p>Dev/Tools can't reach the network right now. Pages you've already opened may still work from cache.</p>
      <div class="actions">
        <button class="mono" type="button" onclick="location.reload()">Retry</button>
        <a class="mono" href="/">Go to index</a>
      </div>
    </main>
  </body>
</html>
